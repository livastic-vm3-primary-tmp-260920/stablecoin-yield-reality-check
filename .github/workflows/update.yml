name: Refresh public read-only yield metadata
on:
  schedule:
    - cron: "23 0,6,12,18 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test offline source guards
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test browser calculator and filters
        run: node --test tests/*.test.mjs
      - name: Safely stop automatic use of sunset API
        run: |
          python - <<'PY'
          from datetime import date
          if date.today() >= date(2026, 11, 13):
              raise SystemExit("Legacy free API sunset: migration required. Last public snapshot remains stale and is explicitly labeled.")
          PY
      - name: Fetch fresh public metadata
        run: python scripts/build.py
      - name: Commit only when feed changed
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/pools.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh public metadata (no wallet data)"
            git push
          fi
